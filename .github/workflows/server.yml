name: server

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real Postgres and Redis so the repository and rate limit tests run
    # instead of skipping, which is the only coverage for the hand written SQL
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: miuchio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIUCHIO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/miuchio_test?sslmode=disable
      # host:port, not a redis:// URL: the test helpers dial it as an address
      MIUCHIO_TEST_REDIS_URL: localhost:6379

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Apply migrations
        run: |
          for f in $(ls migrations/*.up.sql | sort); do
            psql "$MIUCHIO_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Test
        run: go test -count=1 ./...
