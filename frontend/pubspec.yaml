name: keepsy
description: "E2E collaborative album sharing cross-platform mobile app."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.0.0
  flutter_svg: ^2.0.0

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  shared_preferences: ^2.5.5

  # E2EE dependencies
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  # Native libsodium via dart:ffi : kept for X25519/Ed25519 only (sumo
  # variant exposes raw crypto_scalarmult). AEAD/HKDF stay on cryptography
  sodium: ^4.0.2+1
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  app_links: ^6.3.2
  uuid: ^4.5.1
  collection: ^1.18.0
  image: ^4.3.0
  # Disk cache for §5.x media : sqflite-backed records.db + raw ciphertext
  # blobs in <appCacheDir>/keepsy_media/. path_provider gives us cacheDir
  sqflite: ^2.3.0
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  test: ^1.25.8
  build_runner: ^2.4.13
  # sqflite host-test factory : the L2 cache tests open a real sqlite over a
  # tmp dir, which needs the FFI backend on the test runner
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/Google_logo.svg
    - lib/assets/onboarding/
  fonts:
    - family: Inter
      fonts:
        - asset: lib/assets/fonts/Inter-Variable.ttf
